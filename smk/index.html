<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARAE — SMK 목록</title>
<meta name="description" content="다래가 제작한 기술소개자료(SMK) 전체 목록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/hub.css?v=20261112-2">
<style>
.page{padding:72px 0 40px}
.page-head{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:36px}
.page-head h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,10vw,150px);line-height:.88;letter-spacing:.005em}
.page-head h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--paper)}
.page-head p{color:var(--paper-dim);font-size:15px;line-height:1.7;max-width:420px;margin-top:20px}
.big{text-align:right}
.big b{font-family:var(--display);font-weight:400;font-size:clamp(72px,9vw,128px);line-height:.9;display:block}
.big b sup{font-size:.35em;color:var(--mint);vertical-align:top}
.big .mono{color:var(--paper-dim)}

.ctrl{display:flex;flex-direction:column;gap:14px;margin:32px 0 28px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .lbl{color:var(--paper-dim);font-size:11px;width:44px;flex-shrink:0}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--paper);padding:14px 20px 14px 46px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--mint)}
.search input::placeholder{color:var(--paper-dim)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--paper-dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-family:var(--sans);font-size:13px;font-weight:600;background:transparent;color:var(--paper-dim);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:all .2s}
.chips button:hover{color:var(--paper);border-color:var(--paper-dim)}
.chips button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chips button .c{font-family:var(--mono);font-size:10px;opacity:.5;margin-left:4px}
.view{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.view button{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;background:transparent;color:var(--paper-dim);border:0;padding:10px 16px;cursor:pointer}
.view button.on{background:var(--mint);color:var(--ink)}
.result{color:var(--paper-dim);font-size:12px;margin-bottom:18px}

.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.sc{display:block}
.sc .im{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;transition:border-color .25s}
.sc .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.sc:hover .im{border-color:var(--mint)}
.sc:hover .im img{transform:scale(1.05)}
.sc .no{position:absolute;left:10px;top:10px;background:rgba(18,18,18,.85);color:var(--paper);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 10px;border-radius:999px}
.sc .fd{position:absolute;right:10px;top:10px;background:var(--mint);color:var(--ink);font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px}
.sc .t{padding:14px 2px 0}
.sc .t .mono{color:var(--paper-dim);font-size:10.5px}
.sc .t h3{font-size:16px;font-weight:700;line-height:1.4;letter-spacing:-.015em;margin:7px 0 6px}
.sc .t p{color:var(--paper-dim);font-size:13px}
.sc .t mark{background:rgba(60,255,208,.22);color:inherit;border-radius:3px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--paper-dim);text-align:left;padding:12px 10px;border-bottom:1px solid var(--paper-dim)}
.tbl td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-family:var(--mono);font-size:12px;color:var(--paper-dim);white-space:nowrap}
.tbl a{color:var(--mint)}
.tbl tr:hover td{background:var(--ink-2)}
.copy{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer;margin-bottom:14px}
.copy:hover{border-color:var(--mint);color:var(--mint)}
.tblwrap{overflow-x:auto}

@media (max-width:1100px){.sgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.sgrid{grid-template-columns:repeat(2,1fr);gap:22px 14px}.page-head{grid-template-columns:1fr}.big{text-align:left}}
@media (max-width:600px){.page{padding:48px 0 24px}.row .lbl{width:100%}.view{margin-left:0}.sc .t h3{font-size:14px}.tbl{font-size:13px}}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="../">DARAE<i>.</i></a>
    <div class="navlinks">
      <a class="mono" href="../#archive">Archive</a>
      <a class="pill" href="../">HOME ↗</a>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <div class="page-head">
      <div>
        <div class="kicker mono">Sales Material Kit · 기술소개자료</div>
        <h1>SMK<br><em>ARCHIVE</em></h1>
        <p>다래가 행사·뉴스레터를 위해 만든 기술소개자료를 한곳에 모았습니다. 카드를 누르면 기술소개서가 새 탭으로 열립니다.</p>
      </div>
      <div class="big"><b id="total">0<sup>+</sup></b><span class="mono">Tech Sheets</span></div>
    </div>

    <div class="ctrl">
      <div class="row">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="기술명, 연구자, 소속, 균주명으로 찾기"></label>
        <div class="view" id="view"><button data-v="card" class="on">CARD</button><button data-v="table">TABLE</button></div>
      </div>
      <div class="row hide" id="row-year"><span class="mono lbl">연도</span><div class="chips" id="c-year"></div></div>
      <div class="row"><span class="mono lbl">사업</span><div class="chips" id="c-p"></div></div>
      <div class="row"><span class="mono lbl">분야</span><div class="chips" id="c-field"></div></div>
    </div>

    <div class="result mono" id="result"></div>
    <div id="out"></div>
    <p class="empty mono hide" id="empty">검색 결과가 없습니다</p>
  </div>
</main>

<footer>
  <div class="bigmark">DARAE<i>.</i></div>
  <div class="wrap foot"><a class="addr" href="https://map.naver.com/p/search/%EB%8C%80%EC%A0%84%20%EC%9C%A0%EC%84%B1%EA%B5%AC%20%EB%8C%80%EB%8D%95%EB%8C%80%EB%A1%9C%20593" target="_blank" rel="noopener"><span class="mono">© DARAE</span> 대전 유성구 대덕대로 593 (대덕TBC 908호) ↗</a><a class="mono" href="../">Home ↑</a></div>
</footer>

<script src="../data.js?v=20261112-2"></script>
<script>
(function(){
  var D=window.DARAE, ROOT='../';
  var q=new URLSearchParams(location.search);
  var st={year:q.get('year')||'all',p:q.get('p')||'all',field:q.get('field')||'all',q:q.get('q')||'',view:q.get('view')||'card'};
  var LIST=D.smk.map(function(s,i){var p=D.byId[s.p];return Object.assign({i:i,year:p.year,pname:p.short||p.title},s)})
    .sort(function(a,b){return b.year-a.year||((D.byId[b.p].date||'')>(D.byId[a.p].date||'')?1:(D.byId[b.p].date||'')<(D.byId[a.p].date||'')?-1:0)||a.i-b.i});
  function $(id){return document.getElementById(id)}
  function esc(t){return String(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function norm(t){return String(t||'').toLowerCase().replace(/\s+/g,'')}
  function hl(t){var e=esc(t);if(!st.q)return e;var k=st.q.trim();if(!k)return e;
    return e.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),function(m){return '<mark>'+m+'</mark>'})}
  function match(s,o){o=o||st;
    if(o.year!=='all'&&s.year!==+o.year)return false;
    if(o.p!=='all'&&s.p!==o.p)return false;
    if(o.field!=='all'&&s.field!==o.field)return false;
    if(o.q){var k=norm(o.q);if(norm([s.title,s.sub,s.who,s.inst,s.field,s.pname,s.no].join(' ')).indexOf(k)<0)return false}
    return true}
  function cnt(k,v){var o=Object.assign({},st);o[k]=v;return LIST.filter(function(s){return match(s,o)}).length}
  function chips(id,key,items){
    $(id).innerHTML=[['all','전체']].concat(items).map(function(x){var n=cnt(key,x[0]);
      return '<button data-v="'+esc(x[0])+'"'+(st[key]===x[0]?' class="on"':'')+(n||x[0]==='all'?'':' disabled style="opacity:.3"')+'>'+esc(x[1])+'<span class="c">'+n+'</span></button>'}).join('')}

  var years=D.years.filter(function(y){return LIST.some(function(s){return s.year===y})});
  var projs=[];LIST.forEach(function(s){if(projs.indexOf(s.p)<0)projs.push(s.p)});
  var fields=[];LIST.forEach(function(s){if(s.field&&fields.indexOf(s.field)<0)fields.push(s.field)});

  // 숫자
  var end=LIST.length,t0=null;(function step(t){if(!t0)t0=t;var k=Math.min((t-t0)/1100,1);$('total').innerHTML=Math.round(end*(1-Math.pow(1-k,3)))+'<sup>+</sup>';if(k<1)requestAnimationFrame(step)})(performance.now());

  function render(){
    if(years.length>1){$('row-year').classList.remove('hide');chips('c-year','year',years.map(function(y){return [String(y),String(y)]}))}
    chips('c-p','p',projs.map(function(id){var p=D.byId[id];return [id,(years.length>1?p.year+' ':'')+(p.short||p.title)]}));
    chips('c-field','field',fields.map(function(f){return [f,f]}));
    $('view').querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===st.view)});
    var L=LIST.filter(function(s){return match(s)});
    $('result').textContent=L.length+'건';
    $('empty').classList.toggle('hide',L.length>0);
    if(st.view==='table'){
      $('out').innerHTML=L.length?'<button class="copy" id="copy">표 복사</button><div class="tblwrap"><table class="tbl" id="tbl"><thead><tr><th>번호</th><th>기술명</th><th>분야</th><th>소속</th><th>연구자</th><th>사업</th><th>연도</th><th>자료</th></tr></thead><tbody>'+
        L.map(function(s){return '<tr><td>'+esc(s.no)+'</td><td>'+hl(s.title)+(s.sub?'<br><span style="color:var(--paper-dim);font-size:12px">'+hl(s.sub)+'</span>':'')+'</td><td>'+esc(s.field)+'</td><td>'+hl(s.inst)+'</td><td>'+hl(s.who||'')+'</td><td>'+esc(s.pname)+'</td><td>'+s.year+'</td><td><a href="'+D.href(s.url)+'" target="_blank" rel="noopener">열기 ↗</a></td></tr>'}).join('')+'</tbody></table></div>':'';
      var cb=$('copy');if(cb)cb.onclick=function(){
        var rows=[['번호','기술명','분야','소속','연구자','사업','연도','주소']].concat(L.map(function(s){return [s.no,s.title+(s.sub?' ('+s.sub+')':''),s.field,s.inst,s.who||'',s.pname,s.year,D.href(s.url)]}));
        var tsv=rows.map(function(r){return r.join('\t')}).join('\n');
        (navigator.clipboard?navigator.clipboard.writeText(tsv):Promise.reject()).then(function(){cb.textContent='복사됨 — 엑셀·한글에 붙여넣기'},function(){cb.textContent='복사 실패: 표를 직접 선택해 주세요'});
        setTimeout(function(){cb.textContent='표 복사'},2500)};
    }else{
      $('out').innerHTML='<div class="sgrid">'+L.map(function(s){
        return '<a class="sc" href="'+D.href(s.url)+'" target="_blank" rel="noopener"><div class="im"><img src="'+ROOT+'assets/smk/'+s.thumb+'.jpg" alt="" loading="lazy"><span class="no">'+esc(s.no)+'</span>'+(s.field?'<span class="fd">'+esc(s.field)+'</span>':'')+'</div>'+
          '<div class="t"><div class="mono">'+esc(s.pname)+' · '+s.year+'</div><h3>'+hl(s.title)+'</h3><p>'+hl(s.inst)+(s.who?' · '+hl(s.who):'')+(s.sub?'<br>'+hl(s.sub):'')+(s.note?' <span style="color:var(--mint)">'+esc(s.note)+'</span>':'')+'</p></div></a>'}).join('')+'</div>';
    }
    var u=new URL(location.href);['year','p','field','q','view'].forEach(function(k){var d=k==='view'?'card':k==='q'?'':'all';st[k]===d?u.searchParams.delete(k):u.searchParams.set(k,st[k])});
    try{history.replaceState(null,'',u)}catch(e){}
  }
  function on(id,key){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;st[key]=b.dataset.v;render()})}
  on('c-year','year');on('c-p','p');on('c-field','field');on('view','view');
  var tm;$('q').value=st.q;$('q').addEventListener('input',function(e){clearTimeout(tm);tm=setTimeout(function(){st.q=e.target.value;render()},120)});
  render();
})();
</script>
</body>
</html>
